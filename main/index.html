<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Three-Zone Sports — live games, schedules, teams, and archives." />
  <meta name="theme-color" content="#0f141a" />
  <title>Three-Zone Sports</title>
  <style>
    :root { --bg:#0f141a; --text:#e8edf3; --muted:#9aa7b6; --accent:#6ea8ff; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
      font: 16px/1.5 "Segoe UI", Inter, system-ui, sans-serif;
      display: grid; place-items: center; padding: 32px;
    }
    main { max-width: 36rem; }
    .eyebrow { letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-size: .8rem; }
    h1 { margin: .4rem 0 1rem; font-size: 2.2rem; }
    p { color: var(--muted); }
    a.btn {
      display: inline-block; margin-top: 1.25rem; padding: 12px 22px; border-radius: 8px;
      background: var(--accent); color: var(--bg); font-weight: 650; text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Three-Zone Sports</p>
    <h1>Your sports. One place.</h1>
    <p>Live games, schedules, teams, and archives. The public site is on GitHub Pages.</p>
    <a class="btn" href="https://3zonesports.com/">Open 3zonesports.com</a>
  </main>
</body>
</html>
