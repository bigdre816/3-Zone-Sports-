<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Three-Zone Sports — live games happening now." />
  <title>Live · Three-Zone Sports</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <a href="/" class="brand">Three-Zone<small>Sports</small></a>
    <button class="mobile-menu-toggle" id="menu-toggle" type="button" aria-label="Menu">Menu</button>
    <nav id="main-nav" aria-label="Primary">
      <a href="/live/" class="active">Live</a>
      <a href="/schedules/">Schedule</a>
      <a href="/teams/">Teams</a>
      <a href="/schools/">Schools</a>
      <a href="/clips/">Clips</a>
      <a href="/archives/">Archive</a>
      <a href="/app/?to=me" data-signin>My Zone</a>
      <a href="/app/?to=me" data-signin>Account</a>
    </nav>
    <div class="header-actions">
      <a class="btn" href="/app/?to=auth" data-signin>Sign In</a>
    </div>
  </header>

  <main>
    <p class="eyebrow">Live</p>
    <h1>Games happening now</h1>
    <p class="subtitle">Watch verified games as they happen. Sign in when a game is live in your zone.</p>
    <div id="live-container" class="cards">
      <div class="unavailable">Loading live games…</div>
    </div>
  </main>

  <footer>
    <p>Three-Zone Sports · <a href="/">3zonesports.com</a></p>
  </footer>

  <script src="/config.js"></script>
  <script src="/site.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      ThreeZoneSite.loadLive(document.getElementById('live-container'));
    });
  </script>
</body>
</html>
