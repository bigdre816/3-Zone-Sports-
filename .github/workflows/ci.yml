name: control-plane-ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/control-plane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests (invariants + API + end-to-end reconstruction)
        run: python -m pytest -q

  three-zone:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: three-zone-mvp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Three-Zone tests
        run: python -m pytest -q
      - name: Check live Render Blueprint
        working-directory: ${{ github.workspace }}
        run: python3 -c "from pathlib import Path; t=Path('render.yaml').read_text(); assert 'runtime: docker' in t; assert 'dockerfilePath: ./Dockerfile' in t; assert 'healthCheckPath: /api/health' in t; assert 'TZ_ENV' in t and 'demo' in t; assert 'name: three-zone-sports' in t; assert 'runtime: python' not in t; print('ok')"
