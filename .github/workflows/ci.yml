name: control-plane-ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  forbid-direct-ai-providers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Forbid direct AI provider imports outside gateway
        # Run from repository root. Nonzero scanner exit fails this job.
        # Limitations: static heuristics only — see script header comments.
        run: bash docs/multi-ai/ci/forbid_direct_ai_providers.sh "${GITHUB_WORKSPACE}"
      - name: Scanner fixture self-test
        run: bash docs/multi-ai/ci/test_forbid_direct_ai_providers.sh

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/control-plane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests (invariants + API + end-to-end reconstruction)
        run: python -m pytest -q

  three-zone:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: three-zone-mvp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run Three-Zone tests
        run: python -m pytest -q
