# Live Render Blueprint — Three-Zone Sports member + back portal.
# Apply this file only (repo root). Do not apply three-zone-mvp/render.yaml.
#
# One-tap: https://render.com/deploy?repo=https://github.com/bigdre816/3-Zone-Sports-
#
# dockerfilePath and dockerContext are relative to rootDir. The dashboard still
# has Root Directory = three-zone-mvp from the first Blueprint. Prefixing those
# paths with three-zone-mvp makes Render lstat three-zone-mvp/three-zone-mvp
# and the build dies before Docker starts.
services:
  - type: web
    name: three-zone-sports
    runtime: docker
    plan: 0.5c-512mb
    branch: main
    rootDir: three-zone-mvp
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    # Dashboard services have been probing /healthz on $PORT. Keep /api/health
    # as an alias so GitHub Pages catalog health checks still work.
    healthCheckPath: /healthz
    disk:
      name: three-zone-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: TZ_ENV
        value: demo
      - key: TZ_HTTP_HOST
        value: 0.0.0.0
      - key: TZ_WS_HOST
        value: 0.0.0.0
      - key: TZ_DATABASE_PATH
        value: /data/three_zone.sqlite3
      - key: TZ_DATA_DIR
        value: /data
      - key: TZ_ALLOWED_ORIGINS
        value: https://3zonesports.com,https://www.3zonesports.com,https://three-zone-sports.onrender.com,https://three-zone-sports-1.onrender.com
      - key: TZ_PUBLIC_BASE_URL
        value: https://3zonesports.com
      - key: TZ_LIVE_MEDIA_PROVIDER
        value: demo
      - key: TZ_UGC_MEDIA_PROVIDER
        value: fake
      - key: TZ_PHOTO_STORAGE
        value: fake
      - key: TZ_XRPL_MODE
        value: demo
      - key: TZ_TOKEN_SECRET
        generateValue: true
      - key: TZ_MEDIA_SERVICE_KEY
        generateValue: true
