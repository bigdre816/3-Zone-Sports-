# Render Blueprint — Three-Zone Sports member app.
# Public marketing site stays on GitHub Pages (https://3zonesports.com).
# This service is sign-in, live, schedules, archives, and /ops.
services:
  - type: web
    name: three-zone-sports
    runtime: python
    plan: free
    rootDir: three-zone-mvp
    pythonVersion: "3.12.8"
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py --host 0.0.0.0
    healthCheckPath: /api/health
    envVars:
      - key: TZ_ENV
        value: demo
      - key: TZ_HTTP_HOST
        value: 0.0.0.0
      - key: TZ_WS_HOST
        value: 0.0.0.0
      - key: TZ_ALLOWED_ORIGINS
        value: https://3zonesports.com,https://www.3zonesports.com
      - key: TZ_PUBLIC_BASE_URL
        value: https://3zonesports.com
      - key: TZ_LIVE_MEDIA_PROVIDER
        value: demo
      - key: TZ_UGC_MEDIA_PROVIDER
        value: fake
      - key: TZ_PHOTO_STORAGE
        value: fake
      - key: TZ_XRPL_MODE
        value: demo
      - key: TZ_TOKEN_SECRET
        generateValue: true
      - key: TZ_MEDIA_SERVICE_KEY
        generateValue: true
