# AI Gateway switchboard — swap providers by editing this file (or overlay YAML).
# Product code never imports providers; only gateway.run().

enabled: false

privacy_rules:
  public:
    block_providers: []
  member:
    block_providers: []
  restricted:
    # Keep member/restricted media on-box by default
    block_providers: [groq, groq_whisper, gemini, cloudflare]
  internal:
    block_providers: [groq, groq_whisper, gemini, cloudflare]

cost_tiers:
  free_only:
    - local_faster_whisper
    - ollama_nomic
    - ollama_chat
    - local_classifier_stub
    - sports_vision_offline
    - transcription_local
    - transcription_offline
  low:
    - local_faster_whisper
    - ollama_nomic
    - ollama_chat
    - local_classifier_stub
    - groq
    - groq_whisper
    - sports_vision_offline
    - transcription_local
    - transcription_offline
  any:
    - local_faster_whisper
    - ollama_nomic
    - ollama_chat
    - local_classifier_stub
    - groq
    - groq_whisper
    - gemini
    - cloudflare
    - sports_vision_offline
    - transcription_local
    - transcription_offline

tasks:
  caption:
    default_order:
      - local_faster_whisper
      - groq_whisper
    human_review_default: true
  embedding:
    default_order:
      - ollama_nomic
    human_review_default: false
  description:
    default_order:
      - ollama_chat
      - groq
      - gemini
      - cloudflare
    human_review_default: false
  moderation:
    default_order:
      - local_classifier_stub
    human_review_default: false
  sports_vision:
    # G3-B: kill-switch gated; local offline evidence only — no auto cloud / YOLO lock-in
    default_order:
      - sports_vision_offline
    human_review_default: true
  transcription:
    # Y4: local-first path, then offline fake fallback
    default_order:
      - transcription_local
      - transcription_offline
    human_review_default: true

providers:
  local_faster_whisper:
    tier: local_first
    cost: free
  groq_whisper:
    tier: overflow
    cost: low
  ollama_nomic:
    tier: local_first
    cost: free
  ollama_chat:
    tier: local_first
    cost: free
  groq:
    tier: overflow
    cost: low
  gemini:
    tier: fallback
    cost: any
  cloudflare:
    tier: fallback
    cost: any
  local_classifier_stub:
    tier: local_first
    cost: free
  sports_vision_offline:
    tier: local_first
    cost: free
  transcription_local:
    tier: local_first
    cost: free
  transcription_offline:
    tier: local_first
    cost: free

lineage:
  backend: jsonl  # jsonl | sqlite
  path: data/lineage.jsonl
