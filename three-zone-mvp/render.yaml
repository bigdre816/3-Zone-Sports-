# UNUSED. Do not apply this Blueprint.
# Live Render service is repo-root render.yaml (three-zone-sports, Docker).
# Applying this file created the failed 3-Zone-Api Python service.
services:
  - type: web
    name: three-zone-api
    runtime: python
    pythonVersion: 3.12
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    envVars:
      - key: TZ_ENV
        value: production
      - key: TZ_HTTP_HOST
        value: 0.0.0.0
      - key: TZ_WS_HOST
        value: 0.0.0.0
      - key: TZ_HTTP_PORT
        value: 8000
      - key: TZ_WS_PORT
        value: 8765
      - key: TZ_DATABASE_URL
        fromDatabase:
          name: three-zone-postgres
          property: connectionString
      - key: TZ_DATA_DIR
        value: /var/data
      - key: TZ_TOKEN_SECRET
        sync: false
      - key: TZ_MEDIA_SERVICE_KEY
        sync: false
      - key: TZ_ALLOWED_ORIGINS
        value: https://3zonesports.com,https://api.3zonesports.com
      - key: TZ_LIVE_MEDIA_PROVIDER
        value: demo
      - key: TZ_UGC_MEDIA_PROVIDER
        value: fake
      - key: TZ_PHOTO_STORAGE
        value: fake
      - key: TZ_MOTEN_SERVICE_URL
        sync: false
      - key: TZ_MOTEN_SHARED_SECRET
        sync: false
    disk:
      - name: data
        mountPath: /var/data
        sizeGB: 10
    healthCheckPath: /api/health
databases:
  - name: three-zone-postgres
    databaseName: three_zone_prod
    user: three_zone
